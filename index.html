<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Czech Championship</title>
<meta name="theme-color" content="#11457e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0d1015;--panel:#161b23;--panel2:#1e2530;--line:#2a3342;
  --text:#eef2f7;--muted:#9aa7ba;--red:#d7141a;--blue:#2f6fc0;--blue-d:#11457e;
  --green:#22c55e;--amber:#f5b301;--radius:16px;--nav:72px;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,var(--blue-d),#0d1015 70%);border-bottom:3px solid var(--red);padding:10px 12px;display:flex;align-items:center;gap:8px}
header h1{font-size:19px;margin:0;cursor:pointer;line-height:1.15}
header h1 small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{background:rgba(255,255,255,.1);border-radius:99px;padding:6px 11px;font-size:15px;font-weight:700;white-space:nowrap}
main{max-width:880px;margin:0 auto;padding:12px 10px calc(var(--nav) + 28px)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin:20px 2px 10px}
h3{font-size:21px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .card{margin:0}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.bar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red))}
.week{display:flex;gap:5px;align-items:flex-end;height:64px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.week b{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.week div.today b{background:var(--red)}
.round{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:76px}
.round .num{width:50px;height:50px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.round.done .num{background:var(--green);color:#04210f}
.round.locked{opacity:.45;cursor:default}
.round .t{font-weight:800;font-size:19px}.round .s{font-size:14px;color:var(--muted)}
.round .pos{margin-left:auto;font-size:15px;font-weight:800;text-align:right;flex:none}
.round .pos small{display:block;font-size:12px;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--red);color:#fff;font-weight:800;padding:14px 16px;border-radius:14px;width:100%;font-size:18px;min-height:58px}
.btn.alt{background:var(--panel2);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.seg{display:flex;gap:6px}.seg .btn{font-size:16px;min-height:52px;padding:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:6px;background:#0a0d12;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;min-height:60px;border-radius:12px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
nav.tabs button span{font-size:22px;line-height:1}
nav.tabs button.on{background:var(--blue-d);color:#fff}
.phrase .cz{font-size:26px;font-weight:800;line-height:1.2}
.phrase .en{color:var(--muted);font-size:17px;margin-top:2px}
.phrase .note{font-size:15px;color:var(--amber);margin-top:4px}
.spd{display:flex;gap:6px;margin-top:12px}
.spd button{flex:1;min-height:50px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-size:15px;font-weight:700;white-space:nowrap}
.spd button:active{background:var(--blue-d)}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{width:24px;height:6px;border-radius:3px;background:var(--panel2)}
.dots i.on{background:var(--green)}
.cards{display:grid;gap:10px;margin-bottom:12px}.cards .card{margin:0}
.setup{font-size:18px}
.setup table{width:100%;border-collapse:collapse;margin:10px 0;font-size:18px}
.setup td,.setup th{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}
.setup th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.cz{color:#a9cbff;font-weight:700}
.phrase .cz,.fb .cz{color:var(--text)}
.q-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:16px;margin-bottom:8px}
.laps{display:flex;gap:4px;margin-bottom:16px}
.laps i{flex:1;height:8px;border-radius:4px;background:var(--panel2)}
.laps i.ok{background:var(--green)}.laps i.bad{background:var(--red)}.laps i.cur{background:var(--amber)}
.prompt{font-size:32px;font-weight:800;margin:8px 0 16px;text-align:center;line-height:1.2}
.prompt.en{font-size:24px;font-weight:700}
.kind{text-align:center;font-size:14px;letter-spacing:1.3px;text-transform:uppercase;color:var(--amber);font-weight:700}
.sub{text-align:center;color:var(--muted);font-size:15px;margin-top:2px}
.play{display:flex;justify-content:center;gap:14px;margin:14px 0 18px}
.play button{background:var(--blue-d);border:1px solid var(--blue);border-radius:50%;width:84px;height:84px;font-size:34px}
.play button.slow{width:64px;height:64px;font-size:26px;align-self:center}
.opts{display:grid;gap:10px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;text-align:left;font-size:20px;min-height:62px}
.opt.right{background:#0f3b22;border-color:var(--green)}
.opt.wrong{background:#3b0f12;border-color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:21px;font-weight:700;min-height:54px}
.tile.used{opacity:.2;pointer-events:none}
.answer{border-bottom:2px dashed var(--line);margin-bottom:14px;padding-bottom:10px}
input.type{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;color:var(--text);font-size:21px;margin-bottom:10px;min-height:60px}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:18px}
.fb.ok{background:#0f3b22;border:1px solid var(--green)}
.fb.no{background:#3b0f12;border:1px solid var(--red)}
.fb>.cz{font-size:23px;font-weight:800;margin-top:6px}
.result{text-align:center}
.result .p{font-size:72px;font-weight:900;line-height:1}
.warn{background:#3a2a05;border:1px solid var(--amber);color:#ffe08a;font-size:15px}
.muted{color:var(--muted);font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
.back{background:none;color:var(--muted);padding:8px 0;font-size:16px;min-height:44px}
.soon{opacity:.6;cursor:default}
html.wide .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
html.wide .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
html.wide .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
html.wide main{padding-inline:16px}
.ref{width:100%;border-collapse:collapse;margin-top:10px;font-size:16px;background:rgba(0,0,0,.2);border-radius:10px;overflow:hidden}
.ref th{text-align:left;padding:8px 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.ref td{padding:7px 8px;border-top:1px solid rgba(255,255,255,.08)}
.ref tr.hi td{background:rgba(245,179,1,.18);font-weight:800}
.rule{margin-top:8px;font-size:17px}
.gloss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gloss span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:14px;line-height:1.25}
.gloss b{display:block;font-size:16px;color:#a9cbff}
.big{font-size:30px;font-weight:800;text-align:center;margin:4px 0}
.skill{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.2em;gap:10px;align-items:center;margin:9px 0;font-size:15px}
.skill .bar{margin:0}.skill span:last-child{text-align:right;font-weight:700}
</style>
</head>
<body>
<header>
  <h1 onclick="go('home')">🏁 Czech Championship<small>Česká mistrovství · Season 1</small></h1>
  <div class="pills"><span class="pill" id="pStreak">🔥 0</span><span class="pill" id="pXp">⭐ 0</span></div>
</header>
<main id="app"></main>

<script>
/* ===================== CONTENT ===================== */
const ROUNDS = [
{ id:"pozdravy", n:1, title:"Pozdravy", en:"Greetings at the door",
  phrases:[
    ["Ahoj","Hi / bye (informal – ty)","Partner, kids, friends your age."],
    ["Dobrý den","Hello (formal – vy)","Your partner's parents – until they offer ty."],
    ["Dobrý večer","Good evening",""],
    ["Na shledanou","Goodbye (formal)","Literally 'until we see each other again'."],
    ["Jak se máš?","How are you? (ty)",""],
    ["Jak se máte?","How are you? (vy / plural)",""],
    ["Mám se dobře, děkuju.","I'm well, thanks.","Literally 'I have myself well'."],
    ["A ty?","And you? (ty)",""],
    ["A vy?","And you? (vy)",""],
    ["Děkuju","Thank you","Děkuji is the slightly more formal form."],
    ["Prosím","Please / you're welcome / here you go","The Swiss-army word."],
    ["Ano","Yes","Czechs also say 'jo' – and confusingly 'no' – both mean yes!"],
    ["Ne","No",""]
  ],
  setup:`<h3>Ty vs Vy – the two "you"s</h3>
  <p>Czech has an informal <b>ty</b> and a formal <b>vy</b>. Get this right at the door and you've won the first corner.</p>
  <table><tr><th></th><th>ty (informal)</th><th>vy (formal)</th></tr>
  <tr><td>Hello</td><td class="cz">Ahoj</td><td class="cz">Dobrý den</td></tr>
  <tr><td>How are you?</td><td class="cz">Jak se máš?</td><td class="cz">Jak se máte?</td></tr>
  <tr><td>And you?</td><td class="cz">A ty?</td><td class="cz">A vy?</td></tr>
  <tr><td>Bye</td><td class="cz">Ahoj</td><td class="cz">Na shledanou</td></tr></table>
  <p><b>Race rule:</b> your partner and daughter → <b>ty</b>. Her parents → <b>vy</b>, until they say <span class="cz">„Klidně mi tykej“</span> ("feel free to say ty to me"). The older person offers ty – never you.</p>
  <p><b>Spot the pattern:</b> ty-verbs end in <b>-š</b> (máš), vy-verbs end in <b>-te</b> (máte). That works for almost every verb.</p>`
},
{ id:"stul", n:2, title:"U stolu", en:"At the table",
  phrases:[
    ["Dobrou chuť!","Enjoy your meal!","Said before eating – reply with the same."],
    ["Na zdraví!","Cheers!","Also said after a sneeze."],
    ["To je moc dobré.","That's really good.",""],
    ["Chutná mi to.","I like it (the taste).","Literally 'it tastes to me'."],
    ["Ještě trochu, prosím.","A little more, please.",""],
    ["Už nemůžu, děkuju.","I can't eat any more, thanks.","Essential at a Czech Christmas."],
    ["Dáte si kávu?","Would you like a coffee? (vy)","You'll hear this a lot."],
    ["Ano, prosím.","Yes, please.",""],
    ["Ne, děkuju.","No, thank you.",""],
    ["Mám hlad.","I'm hungry.","Literally 'I have hunger'."],
    ["Mám žízeň.","I'm thirsty.","Literally 'I have thirst'."]
  ],
  setup:`<h3>Být & mít – to be, to have</h3>
  <p>These two verbs carry half of all small talk. Czech usually drops the "I/you" – the ending tells you who.</p>
  <table><tr><th>who</th><th>být (be)</th><th>mít (have)</th></tr>
  <tr><td>I</td><td class="cz">jsem</td><td class="cz">mám</td></tr>
  <tr><td>you (ty)</td><td class="cz">jsi</td><td class="cz">máš</td></tr>
  <tr><td>he / she / it</td><td class="cz">je</td><td class="cz">má</td></tr>
  <tr><td>we</td><td class="cz">jsme</td><td class="cz">máme</td></tr>
  <tr><td>you (vy)</td><td class="cz">jste</td><td class="cz">máte</td></tr>
  <tr><td>they</td><td class="cz">jsou</td><td class="cz">mají</td></tr></table>
  <p><b>Note:</b> Czech <i>has</i> hunger and thirst: <span class="cz">Mám hlad</span> = I have hunger. And <span class="cz">To je…</span> = "That is…" – the most useful two words at the table.</p>`
},
{ id:"vanoce", n:3, title:"Vánoce", en:"Christmas Eve",
  phrases:[
    ["Veselé Vánoce!","Merry Christmas!",""],
    ["Šťastný nový rok!","Happy New Year!",""],
    ["Štědrý večer","Christmas Eve (the evening)","The main event: dinner on the 24th, then presents."],
    ["Ježíšek","Baby Jesus – he brings the presents","Not Santa! Listen for the little bell."],
    ["dárek","a present",""],
    ["dárky","presents",""],
    ["stromeček","Christmas tree","Literally 'little tree'."],
    ["kapr","carp","The traditional Christmas Eve fish."],
    ["bramborový salát","potato salad","Served with the carp."],
    ["cukroví","Christmas biscuits",""],
    ["Děkuju za dárek.","Thanks for the present.",""]
  ],
  setup:`<h3>Every noun has a gender</h3>
  <p>Masculine, feminine or neuter. You can usually tell from the ending – and the little word for "the/that" changes with it.</p>
  <table><tr><th>gender</th><th>ending</th><th>examples</th></tr>
  <tr><td>masculine</td><td>consonant</td><td class="cz">ten dárek, ten kapr</td></tr>
  <tr><td>feminine</td><td>-a</td><td class="cz">ta babička, ta káva</td></tr>
  <tr><td>neuter</td><td>-o / -í</td><td class="cz">to cukroví, to pivo</td></tr></table>
  <p><b>Adjectives match the gender:</b> <span class="cz">dobrý den</span> (m) · <span class="cz">dobrá káva</span> (f) · <span class="cz">dobré pivo</span> (n).</p>
  <p><b>Quirk:</b> <span class="cz">Vánoce</span> is always plural – that's why it's <span class="cz">Veselé</span> Vánoce.</p>`
},
{ id:"rodina", n:4, title:"Rodina", en:"Meet the family",
  phrases:[
    ["máma","mum",""],
    ["mami!","Mum! (what kids call out)","Pet form. The textbook vocative is mámo! – see Setup."],
    ["táta","dad",""],
    ["tati!","Dad! (what your daughter shouts)","Pet form. The textbook vocative is táto!"],
    ["babička","grandma",""],
    ["děda","grandpa",""],
    ["dcera","daughter",""],
    ["partnerka","partner (female)",""],
    ["Jmenuju se Daren.","My name is Daren.","Jmenuji se is the formal form."],
    ["Těší mě.","Nice to meet you.",""],
    ["Tohle je moje dcera.","This is my daughter.",""],
    ["Mluvím jen trochu česky.","I only speak a little Czech.",""],
    ["Nerozumím.","I don't understand.",""],
    ["Můžete mluvit pomaleji?","Can you speak more slowly? (vy)","Your listening lifeline."]
  ],
  setup:`<h3>The vocative – calling someone</h3>
  <p>Your first grammar <b>case</b>. When you <i>call</i> or speak <i>to</i> someone, the end of their name changes. Three rules cover most of it:</p>
  <table><tr><th>rule</th><th>talking about</th><th>calling them</th></tr>
  <tr><td>-a → -o</td><td class="cz">máma</td><td class="cz">mámo!</td></tr>
  <tr><td>-a → -o</td><td class="cz">babička</td><td class="cz">babičko!</td></tr>
  <tr><td>-a → -o</td><td class="cz">děda</td><td class="cz">dědo!</td></tr>
  <tr><td>hard consonant → +e</td><td class="cz">Daren</td><td class="cz">Darene!</td></tr>
  <tr><td>soft consonant (š ž č ř j) → +i</td><td class="cz">Tomáš</td><td class="cz">Tomáši!</td></tr></table>
  <p><b>Real life:</b> kids mostly shout the pet forms <span class="cz">mami!</span> and <span class="cz">tati!</span> – that's what you'll hear from your daughter. The textbook forms are <span class="cz">mámo!</span> and <span class="cz">táto!</span></p>
  <p>So when the family call you <span class="cz">Darene</span>, that's not a mistake – that's grammar.</p>`
},
{ id:"tatinek", n:5, title:"Tatínek", en:"Daddy Track taster",
  phrases:[
    ["Pojď sem!","Come here!",""],
    ["Ještě jednou!","Again! / One more time!",""],
    ["Hotovo!","Done! / All finished!",""],
    ["Šikulka!","Clever girl!",""],
    ["Máš hlad?","Are you hungry?","Same as Mám hlad – but the ty form."],
    ["Pojď spinkat.","Come to bed (sleepy time).","spinkat = baby-talk for sleep."],
    ["Dobrou noc.","Goodnight.",""],
    ["Kde je méďa?","Where's teddy?",""],
    ["Dej mi pusu.","Give me a kiss.",""],
    ["Mám tě rád.","I love you. (a man says)","A woman says: Mám tě ráda."]
  ],
  setup:`<h3>Commands & rád / ráda</h3>
  <p><b>Commands to one person (ty)</b> are short: <span class="cz">Pojď!</span> (come) · <span class="cz">Dej!</span> (give) · <span class="cz">Podívej!</span> (look).</p>
  <p><b>Rád / ráda</b> changes with the speaker's gender:</p>
  <table><tr><th>speaker</th><th>I love you</th></tr>
  <tr><td>you (man)</td><td class="cz">Mám tě rád.</td></tr>
  <tr><td>your partner / daughter</td><td class="cz">Mám tě ráda.</td></tr></table>
  <p>Full Daddy Track (bath, food, play, bedtime) arrives in January.</p>`
}
];

const SCEN = [
  {s:"Your partner's mum opens the door. First time meeting.", o:["Ahoj, jak se máš?","Dobrý den, jak se máte?","Na shledanou!"], a:1, why:"Older + first meeting → vy."},
  {s:"Your daughter runs in from the garden.", o:["Dobrý den!","Ahoj!","A vy?"], a:1, why:"Kids always get ty."},
  {s:"Leaving her parents' house on Christmas night.", o:["Dobrý den!","Ahoj!","Na shledanou!"], a:2, why:"Formal goodbye. Dobrý den is only hello."},
  {s:"Her mum smiles: „Klidně mi tykej.“ Then asks how you are. You ask back:", o:["A vy?","A ty?","Prosím."], a:1, why:"She's offered ty – switch! Big moment."},
  {s:"Her dad asks: „Jak se máte?“", o:["Mám se dobře, děkuju. A vy?","Ahoj, a ty?","Na shledanou."], a:0, why:"Answer, thank, and bounce it back in the vy form."}
];

const PHASES = [
  ["Daddy Track","Jan–Feb","Present tense, accusative, your daughter's world"],
  ["Catch-up Talk","Mar–Apr","Past tense, chci / můžu / musím, questions"],
  ["Title Decider","May","Future tense, full-speed listening, 10-min conversation"]
];
const TARGET_HOURS = 45;

const GLOSS={
"Ahoj":"Ahoj=hi / bye (borrowed from English 'ahoy')",
"Dobrý den":"Dobrý=good (masculine form)|den=day (masculine noun)",
"Dobrý večer":"Dobrý=good (masculine)|večer=evening (masculine)",
"Na shledanou":"Na=until|shledanou=seeing again",
"Jak se máš?":"Jak=how|se=yourself|máš=you have (mít · ty)",

"Mám se dobře, děkuju.":"Mám=I have (mít · já)|se=myself|dobře=well|děkuju=I thank",
"A ty?":"A=and|ty=you (informal)",
"A vy?":"A=and|vy=you (formal / plural)",
"Děkuju":"děkuju=I thank (děkovat · já)",

"Na zdraví!":"Na=to|zdraví=health",

"Chutná mi to.":"Chutná=tastes good (chutnat · it)|mi=to me|to=it",
"Ještě trochu, prosím.":"Ještě=more / still|trochu=a little|prosím=please",
"Už nemůžu, děkuju.":"Už=any more|nemůžu=I can't (ne + můžu · já)|děkuju=thanks",
"Dáte si kávu?":"Dáte=you give (dát · vy)|si=yourself|kávu=coffee (káva → kávu as the object)",
"Ano, prosím.":"Ano=yes|prosím=please",
"Ne, děkuju.":"Ne=no|děkuju=thanks",
"Mám hlad.":"Mám=I have (mít · já)|hlad=hunger (masculine)",
"Mám žízeň.":"Mám=I have (mít · já)|žízeň=thirst (feminine – despite the consonant)",
"Veselé Vánoce!":"Veselé=merry (plural form)|Vánoce=Christmas (always plural)",

let S; try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=fresh()}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function bumpStreak(){
  const t=dayStr(); if(S.lastDay===t) return;

  S.streak = S.lastDay===y ? S.streak+1 : 1; S.lastDay=t;
}

}

/* ===================== RACE ===================== */
let R=null;
function startRace(id){
  const idx=ROUNDS.findIndex(x=>x.id===id), r=ROUNDS[idx];
  const cur=ALL.filter(p=>p.round===id), prev=ALL.filter(p=>ROUNDS.findIndex(x=>x.id===p.round)<idx);
  const byWeak=arr=>shuffle(arr).sort((a,b)=>box(a.cz)-box(b.cz));
  let picks=byWeak(cur).slice(0,prev.length?8:10);
  if(prev.length) picks=picks.concat(byWeak(prev).slice(0,2));
  while(picks.length<10) picks.push(cur[Math.random()*cur.length|0]);
  picks=shuffle(picks);
  const types=shuffle(["listen","listen","listen","type","build","build","read","en2cz","listen","type"]);
  let qs=picks.map((p,i)=>{let t=types[i]; if(t==="build"&&p.cz.split(" ").length<2)t="listen"; return {t,p}});
  if(id==="pozdravy") shuffle(SCEN).slice(0,3).forEach((s,i)=>qs[i*3+1]={t:"scen",s});
  R={id,qs,i:0,res:[],answered:false,built:[]};
  go("race");
}
function opts(p,lang){
  const key=lang==="cz"?"cz":"en";
  const pool=shuffle(ALL.filter(x=>x[key]!==p[key])).slice(0,3).map(x=>x[key]);
  return shuffle([p[key],...pool]);
}
function race(){
  const q=R.qs[R.i];
  const laps=R.qs.map((_,i)=>`<i class="${i<R.res.length?(R.res[i]?"ok":"bad"):i===R.i?"cur":""}"></i>`).join("");
  let body="";
  if(q.t==="scen"){
    q.o=q.o||q.s.o.map((x,i)=>({x,i}));
    body=`<div class="kind">Ty or vy?</div><div class="prompt en">${esc(q.s.s)}</div>
    <div class="opts">${q.o.map(o=>`<button class="opt" data-v="${o.i}" onclick="answerScen(${o.i},this)">${esc(o.x)}</button>`).join("")}</div>`;
  } else if(q.t==="listen"){
    q.o=q.o||opts(q.p,"en");
    body=`<div class="kind">🎧 Listen – what does it mean?</div>${playBtns(q.p.cz)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answerOpt(${i},this,'en')">${esc(o)}</button>`).join("")}</div>`;
  } else if(q.t==="read"){
    q.o=q.o||opts(q.p,"en");
    body=`<div class="kind">Read – what does it mean?</div><div class="prompt">${esc(q.p.cz)}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answerOpt(${i},this,'en')">${esc(o)}</button>`).join("")}</div>`;
  } else if(q.t==="en2cz"){
    q.o=q.o||opts(q.p,"cz");
    body=`<div class="kind">Say it in Czech</div><div class="prompt en">${esc(q.p.en)}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answerOpt(${i},this,'cz')">${esc(o)}</button>`).join("")}</div>`;
  } else if(q.t==="build"){
    q.tiles=q.tiles||shuffle(q.p.cz.split(" ").map((w,i)=>({w,i})));
    body=`<div class="kind">Build the phrase</div><div class="prompt en">${esc(q.p.en)}</div>
    <div class="tiles answer">${R.built.map((k,j)=>`<button class="tile" onclick="unbuild(${j})">${esc(q.tiles[k].w)}</button>`).join("")}</div>
    <div class="tiles">${q.tiles.map((t,k)=>`<button class="tile ${R.built.includes(k)?"used":""}" onclick="build(${k})">${esc(t.w)}</button>`).join("")}</div>
    <div style="margin-top:14px"><button class="btn" ${R.built.length===q.tiles.length&&!R.answered?"":"disabled"} onclick="checkBuild()">Check</button></div>`;
  } else if(q.t==="type"){
    body=`<div class="kind">🎧 Type what you hear</div><div class="muted" style="text-align:center">In Czech, or what it means in English</div>${playBtns(q.p.cz)}
    <input class="type" id="typed" autocomplete="off" autocapitalize="off" placeholder="Czech or English – accents optional" onkeydown="if(event.key==='Enter')checkType()">
    <button class="btn" id="chk" onclick="checkType()">Check</button>`;
  }
  app.innerHTML=`<div class="q-head"><span>Lap ${R.i+1}/10</span><button class="back" onclick="twice(this,()=>go('round','${R.id}'))">Retire ✕</button></div>
  <div class="laps">${laps}</div>${body}<div id="fb"></div>`;
  if((q.t==="listen"||q.t==="type")&&!R.answered) setTimeout(()=>speak(q.p.cz),300);
}
const playBtns=cz=>`<div class="play"><button onclick="speak(${esc(JSON.stringify(cz))})">🔊</button><button class="slow" onclick="speak(${esc(JSON.stringify(cz))},0.6)">🐢</button></div>`;

function score(ok){
  if(R.answered)return; R.answered=true;
  const q=R.qs[R.i]; R.res.push(ok);
  if(q.p){ S.mastery[q.p.cz]=ok?Math.min(5,box(q.p.cz)+1):Math.max(0,box(q.p.cz)-2); }
  if(q.t==="listen"||q.t==="type"){S.listen.t++; if(ok)S.listen.r++;}
  if(ok){S.xp+=10;bumpStreak();}
  save(); updatePills();
  const fb=document.getElementById("fb");
  const p=q.p;
  fb.innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Clean lap!":"❌ Lock-up."}
    ${p?`<div class="cz">${esc(p.cz)}</div><div class="muted">${esc(p.en)}</div>${glossHtml(p.cz)}${p.note?`<div style="color:var(--amber);font-size:15px">${esc(p.note)}</div>`:""}${spdBtns(p.cz)}`
      :`<div style="margin-top:6px"><b>${esc(q.s.o[q.s.a])}</b><div class="muted">${esc(q.s.why)}</div></div>`}
  </div><div style="margin-top:12px"><button class="btn" onclick="next()">${R.i<9?"Next lap ›":"Chequered flag 🏁"}</button></div>`;
  if(p&&!ok) speak(p.cz);
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function answerOpt(i,el,lang){
  if(R.answered)return; const q=R.qs[R.i]; const right=q.o[i]===q.p[lang];
  document.querySelectorAll(".opt").forEach((b,k)=>{if(q.o[k]===q.p[lang])b.classList.add("right")});
  if(!right)el.classList.add("wrong"); score(right);
}
function answerScen(v,el){
  if(R.answered)return; const q=R.qs[R.i];
  document.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.v===q.s.a)b.classList.add("right")});
  if(v!==q.s.a)el.classList.add("wrong"); score(v===q.s.a);
}
function build(k){if(R.answered)return;R.built.push(k);race()}
function unbuild(j){if(R.answered)return;R.built.splice(j,1);race()}
function checkBuild(){const q=R.qs[R.i];const s=R.built.map(k=>q.tiles[k].w).join(" ");race();score(s===q.p.cz)}
/* lenient marking: Czech or English meaning, small typos forgiven */
const SYN=[["thank you","thanks","cheers","ta"],["hi","hello","hey"],["bye","goodbye"],["mum","mom","mummy","mother"],["dad","daddy","father"],["grandma","granny","nan","nana"],["grandpa","grandad","granddad"],["present","gift"],["presents","gifts"],["coffee","a coffee"],["hungry","starving"],["goodnight","good night","night night"],["i love you","love you"]];
function syn(s){SYN.forEach(g=>g.slice(1).forEach(w=>{s=(" "+s+" ").replace(new RegExp(" "+w+" ","g")," "+g[0]+" ").trim()}));return s}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function enAnswers(en){
  const base=en.replace(/\(.*?\)/g,"").replace(/–.*$/,"");
  return base.split("/").map(x=>syn(norm(x).replace(/^(the|a|an) /,""))).filter(Boolean);
}
function close(a,b){return a===b||(b.length>3&&lev(a,b)<=Math.max(1,Math.floor(b.length/6)))}
function markTyped(v,p){
  const t=norm(v); if(!t) return false;
  if(close(t,norm(p.cz))) return true;
  const te=syn(t.replace(/^(the|a|an) /,""));
  return enAnswers(p.en).some(a=>close(te,a));
}
function checkType(){
  if(R.answered)return; const q=R.qs[R.i]; const v=document.getElementById("typed").value;
  document.getElementById("chk").disabled=true; score(markTyped(v,q.p));
}
function next(){
  R.i++; R.answered=false; R.built=[];
  if(R.i>=R.qs.length){
    const pct=Math.round(100*R.res.filter(Boolean).length/R.qs.length);
    const st=S.rounds[R.id]||{best:0,runs:0}; const wasLocked=st.best<80;
    st.runs++; st.best=Math.max(st.best,pct); S.rounds[R.id]=st;
    if(pct>=80)S.xp+=20; save();
    go("result",{pct,newUnlock:wasLocked&&pct>=80});
  } else race();
}
function posLabel(p){
  if(p===100)return{big:"P1",short:"🥇 P1",msg:"Lights-to-flag win. Perfect race."};
  if(p>=90)return{big:"P2",short:"🥈 P2",msg:"So close. One lock-up from the win."};
  if(p>=80)return{big:"P3",short:"🥉 P3",msg:"Podium! Next round unlocked."};
  if(p>=60)return{big:"P6",short:"P6",msg:"Points, but not on the podium. Do a Learn lap and go again."};
  return{big:"P14",short:"P14",msg:"Rough one. Back to the Setup tab, then re-run."};
}
function result({pct,newUnlock}){
  const L=posLabel(pct), idx=ROUNDS.findIndex(x=>x.id===R.id), nxt=ROUNDS[idx+1];
  const misses=R.qs.filter((q,i)=>!R.res[i]&&q.p).map(q=>q.p);
  app.innerHTML=`<div class="card result"><div class="muted">Round ${ROUNDS[idx].n} · ${esc(ROUNDS[idx].en)}</div>
    <div class="p">${L.big}</div><div style="font-size:22px;font-weight:800">${pct}%</div><p>${L.msg}</p>
    ${newUnlock&&nxt?`<p>🔓 <b>Round ${nxt.n}: ${esc(nxt.en)}</b> unlocked</p>`:""}</div>
  ${misses.length?`<h2>Debrief – lock-ups</h2>`+`<div class="cards">`+misses.map(p=>`<div class="card phrase"><div class="cz">${esc(p.cz)}</div><div class="en">${esc(p.en)}</div>${spdBtns(p.cz)}</div>`).join("")+`</div>`:""}
  <div class="row" style="margin-top:12px"><button class="btn alt" onclick="startRace('${R.id}')">Re-run</button>
  ${newUnlock&&nxt?`<button class="btn" onclick="tab='learn';go('round','${nxt.id}')">Next round ›</button>`:`<button class="btn" onclick="go('home')">Calendar</button>`}</div>`;
}

/* ===================== PIT CREW: GRAMMAR DRILL ENGINE ===================== */
const PRON=[["já","I"],["ty","you · informal"],["on / ona","he / she"],["my","we"],["vy","you · formal"],["oni","they"]];
const VERBS={
  byt:{inf:"být",en:"to be",f:["jsem","jsi","je","jsme","jste","jsou"],note:"Irregular – learn it as a block. Note ty = jsi: the one ty-form without -š."},
  mit:{inf:"mít",en:"to have",f:["mám","máš","má","máme","máte","mají"],note:"The model pattern: -m (I) · -š (you) · nothing (he/she) · -me (we) · -te (you formal) · -jí (they)."},
  mluvit:{inf:"mluvit",en:"to speak",f:["mluvím","mluvíš","mluví","mluvíme","mluvíte","mluví"],note:"Same endings as mít: -m · -š · – · -me · -te."},
  chtit:{inf:"chtít",en:"to want",f:["chci","chceš","chce","chceme","chcete","chtějí"],note:"Irregular 'I' form (chci) – but ty still ends -š and vy still ends -te."}
};
const verbTable=(k,hi)=>{const v=VERBS[k];return `<table class="ref"><tr><th colspan="2">${v.inf} – ${v.en}</th></tr>${PRON.map((p,i)=>`<tr class="${i===hi?"hi":""}"><td>${p[0]} <span class="muted">${p[1]}</span></td><td class="cz">${v.f[i]}</td></tr>`).join("")}</table>`};
const NOUNS=[
 ["dárek","present","m"],["kapr","carp","m"],["stromeček","Christmas tree","m"],["salát","salad","m"],["den","day","m"],["večer","evening","m"],["rok","year","m"],["dům","house","m"],["pes","dog","m"],["čaj","tea","m"],
 ["táta","dad","m","Ends in -a but means a man → masculine. Meaning beats the ending."],["děda","grandpa","m","Ends in -a but means a man → masculine. Meaning beats the ending."],
 ["babička","grandma","f"],["máma","mum","f"],["káva","coffee","f"],["voda","water","f"],["dcera","daughter","f"],["polévka","soup","f"],["kočka","cat","f"],["partnerka","partner","f"],
 ["noc","night","f","Exception: feminine despite the consonant ending. Learn it with its word: ta noc, dobrou noc."],
 ["pivo","beer","n"],["víno","wine","n"],["auto","car","n"],["mléko","milk","n"],["jídlo","food","n"],["okno","window","n"],["cukroví","Christmas biscuits","n"],
 ["kuře","chicken","n","Ends in -e: young animals are neuter – kuře (chick), kotě (kitten)."]
].map(([cz,en,g,note])=>({cz,en,g,note}));
const G={m:{name:"masculine",ten:"ten",adj:"dobrý",rule:"Ends in a consonant → masculine"},f:{name:"feminine",ten:"ta",adj:"dobrá",rule:"Ends in -a → feminine"},n:{name:"neuter",ten:"to",adj:"dobré",rule:"Ends in -o or -í → neuter"}};
const genderTable=hi=>`<table class="ref"><tr><th>gender</th><th>ending</th><th>that</th><th>good</th></tr>${["m","f","n"].map(k=>`<tr class="${k===hi?"hi":""}"><td>${G[k].name}</td><td>${{m:"consonant",f:"-a",n:"-o / -í"}[k]}</td><td class="cz">${G[k].ten}</td><td class="cz">${G[k].adj}</td></tr>`).join("")}</table>`;
const VOC=[
 ["máma","mámo","-a → -o",["máma","mámu"]],["táta","táto","-a → -o",["táta","tátu"]],["babička","babičko","-a → -o",["babička","babičku"]],
 ["děda","dědo","-a → -o",["děda","dědu"]],["Jana","Jano","-a → -o",["Jana","Janu"]],
 ["Daren","Darene","hard consonant → +e",["Daren","Darenu"]],["Jan","Jane","hard consonant → +e",["Jan","Janu"]],["Adam","Adame","hard consonant → +e",["Adam","Adamu"]],
 ["Tomáš","Tomáši","soft consonant (š ž č ř j) → +i",["Tomáše","Tomáš"]],["Lukáš","Lukáši","soft consonant (š ž č ř j) → +i",["Lukáše","Lukáš"]]
];
const vocTable=rule=>`<table class="ref"><tr><th>rule</th><th>example</th></tr>${[["-a → -o","máma → mámo"],["hard consonant → +e","Daren → Darene"],["soft consonant (š ž č ř j) → +i","Tomáš → Tomáši"]].map(r=>`<tr class="${r[0]===rule?"hi":""}"><td>${r[0]}</td><td class="cz">${r[1]}</td></tr>`).join("")}</table>`;
const RAD=[["You (Daren)","Mám tě ___.","rád"],["Your partner","Mám tě ___.","ráda"],["Your daughter","Mám tě ___.","ráda"],["Grandpa","Mám tě ___.","rád"],["Grandma","Mám tě ___.","ráda"],["The whole family together","Máme tě ___.","rádi"]];
const radTable=hi=>`<table class="ref"><tr><th>speaker</th><th>form</th></tr>${[["a man","rád"],["a woman or girl","ráda"],["a group","rádi"]].map(r=>`<tr class="${r[1]===hi?"hi":""}"><td>${r[0]}</td><td class="cz">${r[1]}</td></tr>`).join("")}</table>`;

const pick=a=>a[Math.random()*a.length|0];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const SKILL_LABEL={tyvy:"Ty / vy endings",byt:"být – to be",mit:"mít – to have",gender:"Noun gender",agree:"ten/ta/to + adjectives",voc:"Vocative",rad:"rád / ráda / rádi"};
const skillKey=s=>({"conj:byt":"byt","who:byt":"byt","conj:mit":"mit","who:mit":"mit",tenTaTo:"agree",adj:"agree"})[s]||s;
const ROUND_SKILLS={pozdravy:["tyvy"],stul:["conj:byt","conj:mit","who:byt","who:mit"],vanoce:["gender","tenTaTo","adj"],rodina:["voc"],tatinek:["rad"]};
const ORDER=["masculine","feminine","neuter","ten","ta","to","dobrý","dobrá","dobré","rád","ráda","rádi"];
function drill(skill){
  const [kind,arg]=skill.split(":");
  const mk=o=>Object.assign({skill:skillKey(skill),typed:false,fixed:false,sub:""},o);
  if(kind==="tyvy"){
    const T=[["___ hlad?","mit","Are you hungry?"],["Jak se ___?","mit","How are you?"],["___ česky?","mluvit","Do you speak Czech?"],["___ kávu?","chtit","Do you want a coffee?"],["Kde ___?","byt","Where are you?"]];
    const W=[["your daughter","ty"],["your partner","ty"],["your partner's mum (first meeting)","vy"],["your partner's dad","vy"],["her parents, both together","vy"]];
    const t=pick(T),w=pick(W),v=VERBS[t[1]],i=w[1]==="ty"?1:4,ans=v.f[i];
    return mk({q:`Asking ${w[0]}:`,big:t[0],sub:t[2],ans,wrong:[v.f[i===1?4:1],v.f[0]],
      why:`${cap(w[0])} → <b>${w[1]}</b>. ${w[1]==="ty"?"ty-forms end in <b>-š</b> (jsi is the one exception)":"vy-forms end in <b>-te</b> (vy is also the plural 'you')"} → <span class="cz">${esc(t[0].replace("___",ans))}</span>`,
      ref:verbTable(t[1],i)});
  }
  if(kind==="conj"){
    const v=VERBS[arg],i=Math.random()*6|0,ans=v.f[i];
    return mk({q:`${v.inf} – ${v.en}`,big:`${PRON[i][0]} ___`,sub:PRON[i][1],ans,wrong:shuffle([...new Set(v.f.filter(f=>f!==ans))]).slice(0,3),
      typed:Math.random()<0.5,why:v.note,ref:verbTable(arg,i)});
  }
  if(kind==="who"){
    const v=VERBS[arg],ok=[0,1,2,3,4,5].filter(i=>v.f.filter(f=>f===v.f[i]).length===1),i=pick(ok);
    const lab=k=>`${PRON[k][0]} (${PRON[k][1]})`;
    return mk({q:`${v.inf} – who is it?`,big:v.f[i],ans:lab(i),wrong:shuffle([0,1,2,3,4,5].filter(k=>k!==i)).slice(0,3).map(lab),
      why:`The ending tells you who – that's why Czech can drop the pronoun. ${v.note}`,ref:verbTable(arg,i)});
  }
  const n=pick(NOUNS),g=G[n.g],why=`<span class="cz">${n.cz}</span>: ${n.note||g.rule+"."} So it's <b>${g.name}</b>`;
  if(kind==="gender") return mk({q:"Which gender?",big:n.cz,sub:n.en,ans:g.name,wrong:["masculine","feminine","neuter"].filter(x=>x!==g.name),fixed:true,why:why+".",ref:genderTable(n.g)});
  if(kind==="tenTaTo") return mk({q:"Which word for 'that / the'?",big:`___ ${n.cz}`,sub:n.en,ans:g.ten,wrong:["ten","ta","to"].filter(x=>x!==g.ten),fixed:true,why:`${why} → <span class="cz">${g.ten} ${n.cz}</span>.`,ref:genderTable(n.g)});
  if(kind==="adj") return mk({q:"Make 'good' agree:",big:`dobr__ ${n.cz}`,sub:"good "+n.en,ans:g.adj,wrong:["dobrý","dobrá","dobré"].filter(x=>x!==g.adj),fixed:true,why:`${why} → <span class="cz">${g.adj} ${n.cz}</span>. Adjectives copy the noun's gender: -ý / -á / -é.`,ref:genderTable(n.g)});
  if(kind==="voc"){const v=pick(VOC);return mk({q:"Calling out to them:",big:`${v[0]} → ___!`,ans:v[1],wrong:v[3],why:`Rule: <b>${v[2]}</b> → <span class="cz">${v[1]}!</span>`,ref:vocTable(v[2])});}
  if(kind==="rad"){const r=pick(RAD);return mk({q:`${r[0]} says:`,big:r[1],sub:"I love you",ans:r[2],wrong:["rád","ráda","rádi"].filter(x=>x!==r[2]),fixed:true,why:`rád / ráda / rádi follows the <b>speaker</b>, not the person being loved. ${r[0]} → <span class="cz">${r[2]}</span>.`,ref:radTable(r[2])});}
}

let P=null;
function startPit(id){
  const idx=ROUNDS.findIndex(r=>r.id===id);
  const cur=ROUND_SKILLS[id], prev=ROUNDS.slice(0,idx).flatMap(r=>ROUND_SKILLS[r.id]);
  const plan=[...Array(prev.length?8:10)].map((_,i)=>cur[i%cur.length]).concat(prev.length?[pick(prev),pick(prev)]:[]);
  const seen=new Set(), qs=[];
  shuffle(plan).forEach(s=>{let d,tries=0;do{d=drill(s);tries++}while(seen.has(d.q+d.big)&&tries<12);seen.add(d.q+d.big);
    d.o=d.fixed?[d.ans,...d.wrong].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)):shuffle([d.ans,...d.wrong]);
    qs.push(d)});
  P={id,qs,i:0,res:[],answered:false,t0:Date.now()};
  go("pit");
}
function pit(){
  const q=P.qs[P.i], n=P.qs.length;
  const laps=P.qs.map((_,i)=>`<i class="${i<P.res.length?(P.res[i]?"ok":"bad"):i===P.i?"cur":""}"></i>`).join("");
  const answer=q.typed
    ?`<input class="type" id="typed" autocomplete="off" autocapitalize="off" placeholder="Type the form…" onkeydown="if(event.key==='Enter')pitType()"><button class="btn" id="chk" onclick="pitType()">Check</button>`
    :`<div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pitAns(${k},this)">${esc(o)}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="q-head"><span>⛽ ${P.i+1}/${n} · ${SKILL_LABEL[q.skill]}</span><button class="back" onclick="twice(this,()=>{tab='pit';go('round','${P.id}')})">Abort ✕</button></div>
  <div class="laps">${laps}</div><div class="kind">${esc(q.q)}</div>
  <div class="big">${esc(q.big)}</div>${q.sub?`<div class="sub">${esc(q.sub)}</div>`:""}
  <div style="margin-top:16px">${answer}</div><div id="fb"></div>`;
}
function pitScore(ok,accentNote){
  if(P.answered)return; P.answered=true;
  const q=P.qs[P.i]; P.res.push(ok);
  const s=S.skills[q.skill]||{r:0,t:0}; s.t++; if(ok)s.r++; S.skills[q.skill]=s;
  if(ok){S.xp+=5;bumpStreak()} save(); updatePills();
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"✅ Clean!":"❌ Wheel nut stuck."}</b> ${ok?"":`Answer: <span class="cz">${esc(q.ans)}</span>`}
  ${accentNote?`<div class="muted">Right form – watch the accents: <span class="cz">${esc(q.ans)}</span></div>`:""}
  <div class="rule">${q.why}</div>${q.ref}</div>
  <div style="margin-top:12px"><button class="btn" onclick="pitNext()">${P.i<P.qs.length-1?"Next drill ›":"Release! 🟢"}</button></div>`;
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function pitAns(k,el){
  if(P.answered)return; const q=P.qs[P.i], ok=q.o[k]===q.ans;
  document.querySelectorAll(".opt").forEach((b,j)=>{if(q.o[j]===q.ans)b.classList.add("right")});
  if(!ok)el.classList.add("wrong"); pitScore(ok);
}
function pitType(){
  if(P.answered)return; const q=P.qs[P.i], v=document.getElementById("typed").value.trim().toLowerCase();
  document.getElementById("chk").disabled=true;
  const exact=v===q.ans.toLowerCase(), loose=!exact&&norm(v)===norm(q.ans);
  pitScore(exact||loose,loose);
}
function pitNext(){
  P.i++; P.answered=false;
  if(P.i<P.qs.length) return pit();
  const n=P.qs.length, right=P.res.filter(Boolean).length, secs=Math.round((Date.now()-P.t0)/1000);
  const st=S.pit[P.id]||{best:0,time:null};
  st.best=Math.max(st.best,right);
  if(right===n&&(!st.time||secs<st.time)) st.time=secs;
  S.pit[P.id]=st; if(right===n)S.xp+=15; save();
  go("pitResult",{right,n,secs});
}
function pitResult({right,n,secs}){
  const by={}; P.qs.forEach((q,i)=>{const b=by[q.skill]||(by[q.skill]={r:0,t:0});b.t++;if(P.res[i])b.r++});
  const misses=P.qs.filter((q,i)=>!P.res[i]);
  const verdict=right===n?(secs<=90?"⚡ Lightning stop – perfect and fast.":"✅ Clean stop. Now do it quicker."):right>=n-1?"Nearly clean – one wheel nut stuck.":"Slow stop. Re-read the Setup sheet and go again.";
  app.innerHTML=`<div class="card result"><div class="muted">⛽ Pit stop · Round ${ROUNDS.find(r=>r.id===P.id).n}</div>
  <div class="p">${right}/${n}</div><div style="font-size:20px;font-weight:700">${secs}s</div><p>${verdict}</p></div>
  <h2>Telemetry by skill</h2><div class="card">${Object.entries(by).map(([k,b])=>`<div class="skill"><span>${SKILL_LABEL[k]}</span><div class="bar"><i style="width:${100*b.r/b.t}%"></i></div><span>${b.r}/${b.t}</span></div>`).join("")}</div>
  ${misses.length?`<h2>Debrief – the rules you missed</h2>`+misses.map(q=>`<div class="card"><div class="kind" style="text-align:left">${esc(q.q)}</div><div style="font-size:22px;font-weight:800">${esc(q.big)} → <span class="cz">${esc(q.ans)}</span></div><div class="rule">${q.why}</div>${q.ref}</div>`).join(""):""}
  <div class="row" style="margin-top:12px"><button class="btn alt" onclick="startPit('${P.id}')">Again</button><button class="btn" onclick="tab='learn';go('round','${P.id}')">To the phrases ›</button></div>`;
}

/* ===================== FIT TO SCREEN =====================
   Chrome on the Fold often switches to "desktop site" (≈980px wide), which shrinks everything.
   Detect that and zoom back to the phone's real width, then apply the chosen text size. */
function fit(){
  const sw=screen.width||innerWidth, r=innerWidth/sw;
  const base=(r>1.25&&r<4)?r:1;
  const z=base*(S.textScale||1);
  document.documentElement.style.zoom=z.toFixed(3);
  document.documentElement.classList.toggle("wide",innerWidth/z>=600);
}
addEventListener("resize",fit); fit();

render();
</script>
</body>
</html>
